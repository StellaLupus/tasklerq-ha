name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check
      - name: Ruff format
        run: uv run --locked ruff format --check
      - name: Mypy
        run: uv run --locked mypy
      - name: Pytest
        run: uv run --locked pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # Pinned to master as of 2026-10-26; upstream has no versioned release.
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # Pinned to main as of 2026-06-08; upstream publishes no recent tags.
      # brands/topics require separate GitHub repositories/settings, not the
      # integration code, so they are skipped in CI.
      - name: HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands topics
